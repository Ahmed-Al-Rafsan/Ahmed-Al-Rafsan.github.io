<style>
/* =====================================================================
   Design: an aerospace drawing sheet. Navy and champagne gold on
   drafting-film white. Spectral for headings, IBM Plex Sans for text,
   Plex Sans Condensed for drawing annotations.
   All words come from content.js. Edit that file, not this one.
   ===================================================================== */
:root{
  --navy:#0B1A33; --navy-2:#11233F; --navy-3:#1A3158;
  --gold:#D9B66E; --gold-2:#EBD5A4; --gold-ink:#86601C;
  --film:#F1F3F6; --sheet:#FFFFFF; --ink:#0E1A2E; --ink-2:#2A3650; --muted:#56607A;
  --rule:#D3D9E3; --rule-2:#E6EAF0;
  --on-navy:#DDE3EE; --on-navy-2:#A4AFC4; --line-navy:rgba(217,182,110,.34);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --wrap:1180px; --pad:clamp(18px,4vw,40px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--film);color:var(--ink);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;line-height:1.15}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:12px;top:-80px;z-index:100;background:var(--gold);color:var(--navy);padding:10px 16px;font-weight:600;text-decoration:none;border-radius:3px}
.skip:focus{top:12px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.ico{width:18px;height:18px;flex:none}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico-s{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ico-f{fill:currentColor}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,26,51,.96);color:var(--on-navy);border-bottom:1px solid rgba(217,182,110,.22)}
@supports (backdrop-filter:blur(8px)){.topbar{background:rgba(11,26,51,.86);backdrop-filter:blur(12px) saturate(1.2)}}
.topbar .wrap{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto;min-width:0}
.mark{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--gold);border-radius:2px;font:500 15px/1 var(--serif);color:var(--gold-2);letter-spacing:.04em}
.brand b{font:500 18px/1.1 var(--serif);color:#F6F1E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:2px}
.nav a{font:500 14.5px/1 var(--sans);color:#BFC8D8;text-decoration:none;padding:10px 10px;border-radius:2px}
.nav a:hover{color:#fff}
.nav a.on{color:var(--gold-2);box-shadow:inset 0 -2px 0 var(--gold)}
.menu-btn{display:none;width:42px;height:42px;place-items:center;border:1px solid rgba(217,182,110,.4);border-radius:3px;color:var(--gold-2)}
@media (max-width:1140px){
  .menu-btn{display:grid}
  .nav{position:fixed;left:0;right:0;top:64px;flex-direction:column;align-items:stretch;gap:0;background:var(--navy);padding:8px var(--pad) 20px;border-bottom:1px solid rgba(217,182,110,.3);display:none;max-height:calc(100vh - 64px);overflow:auto}
  .nav.open{display:flex}
  .nav a{padding:15px 4px;font-size:17px;border-bottom:1px solid rgba(217,182,110,.14)}
  .nav a.on{box-shadow:none}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;font:600 15px/1 var(--sans);padding:14px 20px;border-radius:3px;text-decoration:none;border:1px solid transparent;transition:background-color .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-2)}
.btn-line{border-color:rgba(235,213,164,.55);color:var(--gold-2)}
.btn-line:hover{background:rgba(217,182,110,.12);border-color:var(--gold-2)}
.btn-ink{background:var(--navy);color:#fff}
.btn-ink:hover{background:var(--navy-3)}
.btn-ghost{background:var(--sheet);border-color:var(--rule);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-sm{padding:10px 14px;font-size:14px}
.btn-mail{padding:10px 15px;font-size:14px}
@media (max-width:520px){.btn-mail span{display:none}}

/* ---------- hero: the drawing sheet ---------- */
.hero{background:var(--navy);color:var(--on-navy);padding:26px 0 54px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(217,182,110,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(217,182,110,.045) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
.sheet{position:relative;border:1px solid rgba(217,182,110,.4);padding:clamp(34px,5vw,62px) clamp(22px,4vw,54px) clamp(30px,4vw,46px)}
.sheet::after{content:"";position:absolute;inset:8px;border:1px solid rgba(217,182,110,.13);pointer-events:none}
.zone{position:absolute;font:500 11px/1 var(--cond);color:rgba(235,213,164,.45)}
.zone.t{top:-1px;transform:translate(-50%,-140%)}
.zone.b{bottom:-1px;transform:translate(-50%,140%)}
.zone.l{left:-1px;transform:translate(-160%,-50%)}
.zone.r{right:-1px;transform:translate(160%,-50%)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:clamp(26px,4.5vw,64px);align-items:center}
.hero h1{font:500 clamp(46px,6.6vw,86px)/.98 var(--serif);color:#F6F1E6;letter-spacing:-.018em}
.hero .hl{margin-top:20px;font:500 clamp(17px,1.65vw,20px)/1.45 var(--sans);color:var(--gold-2)}
.hero .hl span{display:block}
.hero .lede{margin-top:20px;font-size:17.5px;color:#C2CADA;max-width:50ch}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.socials a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;border:1px solid rgba(217,182,110,.28);border-radius:3px;color:#C2CADA;text-decoration:none;font-size:14px}
.socials a:hover{color:#fff;border-color:var(--gold)}
.drawing{margin:0}
.drawing svg{display:block;width:100%;height:auto}
.drawing figcaption{margin-top:10px;font:400 13.5px/1.45 var(--cond);color:#94A0B8;max-width:62ch}
.tblock{margin-top:22px;display:grid;grid-template-columns:116px minmax(0,1fr);border:1px solid rgba(217,182,110,.5);background:rgba(17,35,63,.78)}
.tblock img{width:116px;height:100%;min-height:150px;object-fit:cover;object-position:50% 20%;border-right:1px solid rgba(217,182,110,.5)}
.tb-name{font:500 20px/1.2 var(--serif);color:#F6F1E6;padding:11px 14px;border-bottom:1px solid rgba(217,182,110,.32)}
.tblock dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
.tblock dt,.tblock dd{padding:7px 12px;border-bottom:1px solid rgba(217,182,110,.17)}
.tblock dt{font:500 12.5px/1.4 var(--cond);color:var(--gold);border-right:1px solid rgba(217,182,110,.17);padding-left:14px}
.tblock dd{margin:0;font-size:14px;line-height:1.4;color:#DCE2EC}
.tblock dt:nth-last-of-type(1),.tblock dd:last-of-type{border-bottom:0}
@media (max-width:980px){
  .hero-grid{grid-template-columns:1fr}
  .hero-fig{max-width:640px}
  .zone{display:none}
}
@media (max-width:480px){.tblock{grid-template-columns:92px minmax(0,1fr)}.tblock img{width:92px}.tblock dl{grid-template-columns:1fr}.tblock dt{border-right:0;border-bottom:0;padding-bottom:0}}

/* drawing strokes */
.hd .pl{fill:rgba(17,35,63,.92)}
.hd .face{fill:rgba(217,182,110,.16)}
.hd .ol{fill:none;stroke:#D9B66E;stroke-width:1.3}
.hd .hatch{fill:none;stroke:#EBD5A4;stroke-width:.8;stroke-opacity:.55}
.hd .core{fill:#EBD5A4;fill-opacity:.45}
.hd .axis{fill:none;stroke:#EBD5A4;stroke-width:1;stroke-dasharray:5 4;stroke-opacity:.75}
.hd .acc{fill:none;stroke:#F6F1E6;stroke-width:1.6}
.hd .ldr{fill:none;stroke:#D9B66E;stroke-width:.9;stroke-opacity:.8}
.hd .ray{fill:none;stroke:#D9B66E;stroke-width:1;stroke-opacity:.6}
.hd .ray.k{stroke:#F6F1E6;stroke-opacity:1;stroke-width:1.4}
.hd .an{font:500 15px var(--cond);fill:#E4D2A9}
.hd .an2{font:400 14px var(--cond);fill:#A4AFC4}
.hd .anb{font:500 18px var(--serif);fill:#F6F1E6;font-style:italic}
.hd .dot{fill:#D9B66E}
.d{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s cubic-bezier(.45,0,.2,1) forwards;animation-delay:var(--d,0s)}
.fade{opacity:0;animation:fade .7s ease forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

/* ---------- sections ---------- */
.sec{padding:clamp(60px,8vw,104px) 0;border-top:1px solid var(--rule)}
.sec.dark{background:var(--navy);color:var(--on-navy);border-top:0}
.sec.tint{background:#E9EDF2}
.sec-grid{display:grid;grid-template-columns:minmax(0,270px) minmax(0,1fr);gap:clamp(28px,5vw,72px)}
.rail{position:sticky;top:100px;align-self:start}
.rail h2{font:500 clamp(32px,3.3vw,42px)/1.08 var(--serif);letter-spacing:-.01em}
.dark .rail h2{color:#F6F1E6}
.rail p{margin-top:12px;font-size:16px;color:var(--muted);max-width:32ch}
.rail .rail-note{margin-top:16px;padding-top:14px;border-top:1px solid var(--rule);font-size:14.5px}
.dark .rail p{color:var(--on-navy-2)}
.dark .rail .rail-note{border-color:var(--line-navy)}
.body{min-width:0}
.blk+.blk{margin-top:58px}
.blk>h3{font:500 25px/1.2 var(--serif);margin-bottom:6px}
.dark .blk>h3{color:#F6F1E6}
.blk>.note{color:var(--muted);font-size:15.5px;max-width:64ch;margin-bottom:18px}
.dark .blk>.note{color:var(--on-navy-2)}
.blk>h3+:not(.note){margin-top:16px}
.lead{font:400 clamp(20px,2vw,23px)/1.55 var(--serif);color:var(--ink-2);max-width:44ch}
.dark .lead{color:#F1EBDD}
.para{max-width:66ch;color:var(--ink-2)}
.dark .para{color:#C2CADA}
.lead+.para,.para+.para{margin-top:14px}
@media (max-width:900px){.sec-grid{grid-template-columns:1fr}.rail{position:static}.rail p{max-width:60ch}}

/* status chips */
.st{display:inline-flex;align-items:center;gap:7px;font:600 12.5px/1 var(--sans);padding:6px 10px 6px 8px;border-radius:999px;white-space:nowrap}
.st::before{content:"";width:8px;height:8px;border-radius:50%}
.st-built{background:var(--navy);color:var(--gold-2)}
.st-built::before{background:var(--gold)}
.st-building{background:#FBF4E4;color:var(--gold-ink);box-shadow:inset 0 0 0 1px var(--gold)}
.st-building::before{background:linear-gradient(90deg,var(--gold-ink) 50%,transparent 50%);box-shadow:inset 0 0 0 1px var(--gold-ink)}
.st-planned{color:var(--muted);border:1px dashed #9AA3B5;padding:5px 9px 5px 7px}
.st-planned::before{border:1px dashed #9AA3B5;width:6px;height:6px}
.dark .st-built{background:var(--gold);color:var(--navy)}
.dark .st-built::before{background:var(--navy)}
.dark .st-building{background:rgba(217,182,110,.14);color:var(--gold-2);box-shadow:inset 0 0 0 1px var(--gold)}
.dark .st-building::before{background:linear-gradient(90deg,var(--gold-2) 50%,transparent 50%);box-shadow:inset 0 0 0 1px var(--gold-2)}
.dark .st-planned{color:var(--on-navy-2);border-color:#6F7C96}
.dark .st-planned::before{border-color:#6F7C96}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:14px;color:var(--muted);margin-bottom:16px}
.dark .legend{color:var(--on-navy-2)}
.meta{font:500 14px/1.5 var(--cond);color:var(--gold-ink)}
.meta span{display:block}
.dark .meta{color:var(--gold)}

/* about */
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px;border-top:1px solid var(--ink)}
.spec div{display:grid;grid-template-columns:92px minmax(0,1fr);gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--rule)}
.spec b{font:500 40px/1 var(--serif);color:var(--gold-ink);font-variant-numeric:lining-nums}
.spec span{font-size:15px;color:var(--ink-2);line-height:1.5}
@media (max-width:620px){.spec{grid-template-columns:1fr}}
.route{list-style:none;margin:0;padding:34px 0 0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px;position:relative}
.route::before{content:"";position:absolute;left:5px;right:0;top:9px;border-top:1.5px dashed var(--gold-ink)}
.route li{position:relative}
.route li::before{content:"";position:absolute;left:0;top:-30px;width:11px;height:11px;border-radius:50%;background:var(--film);border:2px solid var(--gold-ink)}
.route li:last-child::before{background:var(--gold-ink)}
.route .when{font:500 13.5px/1.35 var(--cond);color:var(--gold-ink)}
.route h4{font:500 19px/1.25 var(--serif);margin:6px 0 6px}
.route p{font-size:14.5px;line-height:1.55;color:var(--muted)}
@media (max-width:1060px){.route{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:30px}.route::before{display:none}.route li::before{display:none}.route li{border-top:1.5px solid var(--gold-ink);padding-top:12px}.route{padding-top:0}}
@media (max-width:560px){.route{grid-template-columns:1fr}}
.evid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.evid section{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--navy);padding:18px 20px 20px}
.evid h4{font:600 16px/1.3 var(--sans)}
.evid ul{margin:10px 0 0;padding-left:18px;font-size:15px;line-height:1.55;color:var(--ink-2)}
.evid li+li{margin-top:7px}
@media (max-width:700px){.evid{grid-template-columns:1fr}}

/* projects */
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pcard{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule)}
.pcard .art{position:relative;background:var(--navy);aspect-ratio:16/9}
.pcard .art svg{position:absolute;inset:0;width:100%;height:100%}
.pcard .pc{display:flex;flex-direction:column;gap:10px;flex:1;padding:20px 22px 22px}
.pcard .type{font:500 13.5px/1.3 var(--cond);color:var(--gold-ink)}
.pcard h3{font:500 23px/1.2 var(--serif)}
.pcard p.d2{font-size:15px;line-height:1.6;color:var(--ink-2)}
.pcard .acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:8px}
.pcard:first-child{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr)}
.pcard:first-child .art{aspect-ratio:auto;min-height:280px}
.pcard:first-child h3{font-size:28px}
@media (max-width:760px){.feat{grid-template-columns:1fr}.pcard:first-child{display:flex}.pcard:first-child .art{aspect-ratio:16/9;min-height:0}}
.metrics{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:2px 0 0;padding:0}
.metrics li{font:500 13.5px/1 var(--cond);padding:7px 10px;background:var(--film);border:1px solid var(--rule-2);border-radius:2px;color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{font:500 14px/1 var(--sans);padding:10px 14px;border:1px solid var(--rule);background:var(--sheet);border-radius:999px;color:var(--ink-2)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.count{font-size:14px;color:var(--muted);margin:0 0 10px}
.reg{width:100%;border-collapse:collapse;background:var(--sheet);border:1px solid var(--rule)}
.reg th{text-align:left;font:500 13px/1.3 var(--cond);color:var(--muted);padding:11px 16px;border-bottom:1px solid var(--ink);background:#F7F8FA}
.reg td{padding:15px 16px;border-bottom:1px solid var(--rule-2);vertical-align:top;font-size:15px;line-height:1.5}
.reg tr:last-child td{border-bottom:0}
.reg tr[hidden]{display:none}
.reg .t button{font:500 18px/1.25 var(--serif);color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px}
.reg .t button:hover{text-decoration-color:var(--gold-ink)}
.reg .t small{display:block;margin-top:4px;font:400 13.5px/1.4 var(--cond);color:var(--muted)}
.reg .res{color:var(--ink-2)}
.reg .lk{white-space:nowrap;text-align:right}
.reg .lk a{font-weight:600;font-size:14px;color:var(--navy-3);text-underline-offset:3px}
.reg .lk a+a{margin-left:14px}
@media (max-width:760px){
  .reg,.reg tbody,.reg tr,.reg td{display:block;width:100%}
  .reg thead{display:none}
  .reg tr{border-bottom:1px solid var(--rule);padding:14px 16px}
  .reg td{border:0;padding:2px 0}
  .reg .lk{text-align:left;padding-top:8px}
  .reg .cat{font:500 13px/1.4 var(--cond);color:var(--gold-ink)}
}

/* research (dark) */
.interests{list-style:none;margin:0;padding:0;border-top:1px solid var(--line-navy)}
.interests li{position:relative;padding:15px 0 15px 26px;border-bottom:1px solid rgba(217,182,110,.17);font:400 19px/1.4 var(--serif);color:#F1EBDD}
.interests li::before{content:"";position:absolute;left:2px;top:24px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
.works{display:grid;gap:14px}
.work{border:1px solid var(--line-navy);background:var(--navy-2);padding:20px 22px}
.w-top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
.work h4{font:500 21px/1.25 var(--serif);color:#F6F1E6}
.work .meta{margin:6px 0 8px}
.work p.tx{font-size:15.5px;color:#C2CADA;max-width:64ch}
.work a{display:inline-block;margin-top:10px;font-weight:600;font-size:14.5px;color:var(--gold-2);text-underline-offset:3px}
.srows{border-top:1px solid var(--ink)}
.dark .srows{border-color:var(--line-navy)}

.esheet .fig svg{display:block;width:100%;max-width:500px;height:auto;margin:0 auto}
.esheet figcaption{margin-top:8px;font:400 13px/1.45 var(--cond);color:var(--muted)}
.esheet .tx{padding:22px 26px 26px}
.esheet ul{columns:2 300px;column-gap:32px}
.esheet li{break-inside:avoid}
.e-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.esheet h4{font:500 22px/1.25 var(--serif)}
.esheet .meta{margin:6px 0 12px}
.esheet p{font-size:15.5px;color:var(--ink-2)}
.esheet ul{margin:12px 0 0;padding-left:18px;font-size:14.5px;line-height:1.55;color:var(--ink-2)}
.esheet li+li{margin-top:6px}
.esheet.noart{grid-template-columns:1fr}

.eng .e-ln{fill:none;stroke:#1A3158;stroke-width:1.4}

.eng .e-it{font:500 15px var(--serif);font-style:italic;fill:#86601C}
.eng .e-ar{fill:#56607A}
.stamp{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center;margin-top:22px;border:1.5px solid var(--gold-ink);background:#FFFCF5;padding:18px 22px}

.dark .pills li{background:var(--navy-2);border-color:var(--line-navy)}
.bul{margin:0;padding-left:18px;font-size:15px;color:var(--ink-2);max-width:70ch}
.bul li+li{margin-top:6px}
.groups{display:grid;gap:22px}
.groups h4{font:600 15.5px/1.35 var(--sans);margin-bottom:9px}

/* skills */

.gauge{display:flex;align-items:center;gap:4px;font:500 13.5px/1 var(--cond);color:var(--ink-2)}

.levels{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:14px;color:var(--muted);margin-bottom:14px}

.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}

.vids{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.vid{display:block;text-decoration:none;background:var(--sheet);border:1px solid var(--rule)}
.vid:hover b{text-decoration:underline;text-decoration-color:var(--gold-ink)}
.vid .th{position:relative;aspect-ratio:16/9;background:var(--navy);overflow:hidden}

@media (max-width:820px){.vids{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.vids{grid-template-columns:1fr}}

/* life */
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.gal figure{margin:0;background:var(--sheet);border:1px solid var(--rule)}
.gal img{width:100%;aspect-ratio:4/5;object-fit:cover}
.gal figcaption{padding:16px 18px 20px}
.gal h4{font:500 20px/1.25 var(--serif);margin-bottom:6px}
.gal p{font-size:15px;color:var(--ink-2)}
@media (max-width:560px){.gal{grid-template-columns:1fr}}

/* contact */
.c-lead{font:400 clamp(24px,2.6vw,32px)/1.35 var(--serif);color:#F6F1E6;max-width:30ch}
.c-acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.c-links{margin-top:38px;border-top:1px solid var(--line-navy)}
.c-links a{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid rgba(217,182,110,.17);text-decoration:none}
.c-links b{font:500 19px/1.2 var(--serif);color:#F6F1E6}
.c-links span{font-size:15px;color:var(--on-navy-2);overflow-wrap:anywhere}
.c-links i{font-style:normal;font-weight:600;font-size:14px;color:var(--gold-2)}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:3px;font-size:14.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0)}

.dlg::backdrop{background:rgba(8,16,34,.74)}
.dlg .x{position:sticky;top:12px;float:right;margin:12px 12px -52px 0;z-index:2;width:40px;height:40px;display:grid;place-items:center;border-radius:3px;background:var(--navy);color:#fff;border:1px solid rgba(235,213,164,.5)}

const S = window.SITE;
if (!S) return;

const f1 = n => (Math.round(n * 10) / 10).toString();

const ghLink = (P.links || []).find(l => /github\.com/i.test(l.url));

const repoUrl = p => GH + '/' + p.repo;

/* ---------- icons ---------- */
const ICON = {

/* Old room anchors (used inside content.js links) mapped to sections on this page. */
const ROOM_TO_SECTION = {office:'about', aeronautical:'engineering', data:'skills', 'ai-stack':'skills', projects:'projects', credentials:'credentials', knowledge:'credentials', journal:'writing', life:'life', contact:'contact', research:'research'};
const fixLink = (url, label) => {

/* The hero drawing: the thesis laminate as an exploded oblique view,
   plus the 19 fibre angles (−45° to +45° in 5° steps) that were analysed. */
function heroDrawing() {
  const k = .42, U = 300, V = 150, ox = 30, gap = 80, oy = 112, T = 6;
  const pt = (u, v, lv) => [ox + u + k * v, oy + lv * gap - k * v];
  const xy = p => f1(p[0]) + ',' + f1(p[1]);
  const poly = a => a.map(xy).join(' ');
  let defs = '', s = '';
  const plies = [
    {lv:0, kind:'hatch', ang:30, lab:['Outer ply, epoxy-carbon', 'fibre angle θ, 0.125 mm']},
    {lv:1, kind:'core', lab:['Resin-epoxy core', '0.125 mm']},
    {lv:2, kind:'hatch', ang:0, lab:['Epoxy-carbon ply', '0.125 mm']}
  ];
  plies.forEach((pl, i) => {
    const c = [pt(0,0,pl.lv), pt(U,0,pl.lv), pt(U,V,pl.lv), pt(0,V,pl.lv)];
    const id = 'hp' + i;
    defs += '<clipPath id="' + id + '"><polygon points="' + poly(c) + '"/></clipPath>';
    const front = [c[0], c[1], [c[1][0], c[1][1] + T], [c[0][0], c[0][1] + T]];
    const side = [c[1], c[2], [c[2][0], c[2][1] + T], [c[1][0], c[1][1] + T]];
    s += '<polygon class="face fade" style="--d:' + (.2 + i * .15) + 's" points="' + poly(front) + '"/><polygon class="face fade" style="--d:' + (.2 + i * .15) + 's" points="' + poly(side) + '"/>';
    s += '<polygon class="pl" points="' + poly(c) + '"/>';
    let pat = '';
    if (pl.kind === 'core') {
      for (let u = 8; u < U; u += 14) for (let v = 8; v < V; v += 14) { const p = pt(u, v, pl.lv); pat += '<circle cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="1"/>'; }
      s += '<g class="core fade" style="--d:' + (.9 + i * .12) + 's">' + pat + '</g>';
    } else {
      const th = pl.ang * Math.PI / 180, d = [Math.cos(th), Math.sin(th)], n = [-Math.sin(th), Math.cos(th)], c0 = [U / 2, V / 2];
      for (let o = -220; o <= 220; o += 12) {
        const a = [c0[0] + n[0] * o - d[0] * 300, c0[1] + n[1] * o - d[1] * 300], b = [c0[0] + n[0] * o + d[0] * 300, c0[1] + n[1] * o + d[1] * 300];
        pat += 'M' + xy(pt(a[0], a[1], pl.lv)) + 'L' + xy(pt(b[0], b[1], pl.lv));
      }
      s += '<path class="hatch fade" style="--d:' + (.9 + i * .12) + 's" clip-path="url(#' + id + ')" d="' + pat + '"/>';
    }
    s += '<path class="ol d" pathLength="1" style="--d:' + (i * .18) + 's" d="M' + poly(c).replace(/ /g, 'L') + 'Z"/>';
    s += '<path class="ol d" pathLength="1" style="--d:' + (.3 + i * .18) + 's" d="M' + xy(front[3]) + 'L' + xy(front[2]) + 'L' + xy(side[2]) + '"/>';
    const a = pt(U - 12, V * .5, pl.lv), yl = a[1];
    s += '<path class="ldr d" pathLength="1" style="--d:' + (1.25 + i * .12) + 's" d="M' + xy(a) + 'L425,' + f1(yl) + '"/><circle class="dot fade" style="--d:' + (1.25 + i * .12) + 's" cx="' + f1(a[0]) + '" cy="' + f1(a[1]) + '" r="2.4"/>';
    s += '<text class="an fade" style="--d:' + (1.5 + i * .12) + 's" x="431" y="' + f1(yl - 3) + '">' + esc(pl.lab[0]) + '</text><text class="an2 fade" style="--d:' + (1.55 + i * .12) + 's" x="431" y="' + f1(yl + 14) + '">' + esc(pl.lab[1]) + '</text>';
  });
  /* angle marker on the top ply: span axis and fibre direction */
  const A = [56, 40], L = 110, th = 30 * Math.PI / 180;
  const arc = []; for (let t = 0; t <= 30; t += 3) { const r = t * Math.PI / 180; arc.push(pt(A[0] + 42 * Math.cos(r), A[1] + 42 * Math.sin(r), 0)); }
  s += '<path class="axis d" pathLength="1" style="--d:1.1s" d="M' + xy(pt(A[0], A[1], 0)) + 'L' + xy(pt(A[0] + 210, A[1], 0)) + '"/>';
  s += '<path class="acc d" pathLength="1" style="--d:1.2s" d="M' + xy(pt(A[0], A[1], 0)) + 'L' + xy(pt(A[0] + L * Math.cos(th), A[1] + L * Math.sin(th), 0)) + '"/>';
  s += '<path class="acc d" pathLength="1" style="--d:1.35s" d="M' + arc.map(xy).join('L') + '"/>';
  const tl = pt(A[0] + 56 * Math.cos(th / 2), A[1] + 56 * Math.sin(th / 2), 0);
  s += '<text class="anb fade" style="--d:1.5s" x="' + f1(tl[0] + 2) + '" y="' + f1(tl[1] + 5) + '">θ</text>';
  const sp = pt(A[0] + 210, A[1], 0);
  s += '<text class="an2 fade" style="--d:1.5s" x="' + f1(sp[0] + 6) + '" y="' + f1(sp[1] + 4) + '">span</text>';
  /* the 19 analysed fibre angles */
  const O = [48, 380], RL = 86;
  s += '<circle class="dot fade" style="--d:1.6s" cx="' + O[0] + '" cy="' + O[1] + '" r="3"/>';
  for (let i = 0; i < 19; i++) {
    const deg = -45 + i * 5, r = deg * Math.PI / 180, e = [O[0] + RL * Math.cos(r), O[1] - RL * Math.sin(r)];
    s += '<path class="ray' + (deg % 45 === 0 ? ' k' : '') + ' d" pathLength="1" style="--d:' + f1(1.65 + i * .055) + 's" d="M' + O[0] + ',' + O[1] + 'L' + xy(e) + '"/>';
  }
  const ar = []; for (let deg = -45; deg <= 45; deg += 3) { const r = deg * Math.PI / 180; ar.push([O[0] + (RL + 12) * Math.cos(r), O[1] - (RL + 12) * Math.sin(r)]); }
  s += '<path class="ldr d" pathLength="1" style="--d:2.5s" d="M' + ar.map(xy).join('L') + '"/>';
  const lab = (deg, txt) => { const r = deg * Math.PI / 180; return '<text class="an fade" style="--d:2.6s" x="' + f1(O[0] + (RL + 18) * Math.cos(r)) + '" y="' + f1(O[1] - (RL + 18) * Math.sin(r) + 4) + '">' + txt + '</text>'; };
  s += lab(45, '+45°') + lab(0, '0°') + lab(-45, '−45°');
  s += '<text class="an fade" style="--d:2.7s" x="196" y="360">Fibre angle θ from −45° to +45° in 5° steps:</text>';
  s += '<text class="an fade" style="--d:2.75s" x="196" y="381">19 lay-ups, each solved in ANSYS Workbench</text>';
  s += '<text class="an2 fade" style="--d:2.8s" x="196" y="404">for total deformation, equivalent stress and</text>';
  s += '<text class="an2 fade" style="--d:2.8s" x="196" y="422">maximum shear stress</text>';
  return '<svg class="hd" viewBox="0 0 600 480" role="img" aria-labelledby="hd-t"><title id="hd-t">Drawing of a three-ply composite wing laminate, shown exploded, with a fan of the 19 fibre angles analysed in the thesis</title><defs>' + defs + '</defs>' + s + '</svg>' +
    '<figcaption>Redrawn from my BEng thesis: a three-ply composite flapping-wing laminate, analysed in finite-element software for 19 fibre angles.</figcaption>';
}

function specHTML(items) {

function routeHTML(items) {
  return '<ol class="route">' + items.slice().reverse().map(i => '<li><p class="when">' + esc(plain(i.when)) + '</p><h4>' + esc(i.title) + '</h4><p>' + esc(i.text) + '</p></li>').join('') + '</ol>';
}
function evidenceHTML(groups) {
  return '<div class="evid">' + groups.map(g => '<section><h4>' + esc(g.name) + '</h4><ul>' + g.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></section>').join('') + '</div>';

function about() {
  const r = room('office'); if (!r) return '';
  let b = P.intro && P.intro[1] ? '<div class="blk"><p class="lead">' + esc(P.intro[1]) + '</p></div>' : '';
  r.blocks.forEach(x => {
    if (x.type === 'profile') return;
    if (x.type === 'facts') b += blk(x, specHTML(x.items));
    else if (x.type === 'timeline') b += blk({title:x.title, note:'Oldest on the left.'}, routeHTML(x.items));
    else if (x.type === 'list') b += blk(x, evidenceHTML(x.groups));
    else b += generic(x);
  });
  return section('about', 'About', r.summary, b);
}

/* ---------- project cover art ---------- */
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }
const hash = t => { let h = 7; for (const c of String(t)) h = (h * 31 + c.charCodeAt(0)) % 2147483647; return h; };
let artId = 0;
function projArt(p) {
  const r = rng(hash(p.id || p.title));
  let g = ''; for (let x = 20; x < 320; x += 20) g += 'M' + x + ',0V180'; for (let y = 20; y < 180; y += 20) g += 'M0,' + y + 'H320';

    if (auc) s += '<text class="lbg" x="112" y="74">' + esc(auc) + '</text>';
    s += '<text class="lb" x="163" y="168" text-anchor="middle">False positive rate</text><text class="lb" transform="translate(62 90) rotate(-90)" text-anchor="middle">True positive rate</text>';
  } else if (art === 'pipeline') {
    const box = (x, y, w, t, c) => '<rect class="' + (c || 'bx') + '" x="' + x + '" y="' + y + '" width="' + w + '" height="36" rx="2"/><text class="lbin" x="' + (x + w / 2) + '" y="' + (y + 22) + '" text-anchor="middle">' + t + '</text>';
    const arrow = (x, y) => '<path class="dt2" d="M' + x + ',' + y + 'l-7,-4v8z"/>';
    s += box(20, 72, 62, 'Extract') + box(104, 72, 62, 'Validate') + box(214, 34, 86, 'Accepted', 'bxo') + box(214, 110, 86, 'Quarantined', 'bxw');
    s += '<path class="ax" d="M82,90H104"/>' + arrow(104, 90);
    s += '<path class="ax" d="M166,90C190,90 190,52 214,52M166,90C190,90 190,128 214,128"/>' + arrow(214, 52) + arrow(214, 128);
    s += '<text class="lb" x="160" y="168" text-anchor="middle">every row accounted for</text>';
  } else if (art === 'people') {
    const X = t => 64 + t * 200, Y = t => 146 - t * 108;
    let c = ''; for (let t = -6; t <= 6.01; t += .4) c += (c ? 'L' : 'M') + f1(X((t + 6) / 12)) + ',' + f1(Y(1 / (1 + Math.exp(-t))));
    s += '<path class="ax" d="M64,30V146H266"/><path class="ln2" d="M64,38H266M64,146H266" style="stroke-opacity:.35"/>';
    for (let i = 0; i < 16; i++) { s += '<circle class="dt2" cx="' + f1(X(Math.pow(r(), 1.6) * .8)) + '" cy="' + f1(Y(0) - 4 - r() * 4) + '" r="2.6"/>'; s += '<circle class="dt" cx="' + f1(X(1 - Math.pow(r(), 1.6) * .8)) + '" cy="' + f1(Y(1) + 4 + r() * 4) + '" r="2.6"/>'; }
    s += '<path class="ln" d="' + c + '"/><text class="lb" x="70" y="26">Left the company</text><text class="lb" x="262" y="166" text-anchor="end">Stayed</text>';
  } else if (art === 'clusters') {
    const C = [[92,112],[172,62],[244,126]];

/* ---------- engineering drawings ---------- */
function engArt(kind) {
  const id = 'ea' + (++artId);
  const fan = (O, RL) => { let h = ''; for (let i = 0; i < 19; i++) { const r = (-45 + i * 5) * Math.PI / 180; h += 'M' + O[0] + ',' + O[1] + 'L' + f1(O[0] + RL * Math.cos(r)) + ',' + f1(O[1] - RL * Math.sin(r)); } return h; };
  if (kind === 'laminate') {
    let hatch = ''; const th = 30 * Math.PI / 180, d = [Math.cos(th), -Math.sin(th)], n = [Math.sin(th), Math.cos(th)];
    for (let o = -260; o <= 260; o += 11) hatch += 'M' + f1(210 + n[0] * o - d[0] * 300) + ',' + f1(120 + n[1] * o - d[1] * 300) + 'L' + f1(210 + n[0] * o + d[0] * 300) + ',' + f1(120 + n[1] * o + d[1] * 300);
    let ticks = ''; for (let y = 64; y <= 178; y += 10) ticks += 'M66,' + y + 'l-9,9';
    const A = [98, 148];
    let arc = ''; for (let t = 0; t <= 30; t += 3) { const r = t * Math.PI / 180; arc += (t ? 'L' : 'M') + f1(A[0] + 42 * Math.cos(r)) + ',' + f1(A[1] - 42 * Math.sin(r)); }
    const svg = '<svg class="eng" viewBox="0 0 420 300" role="img" aria-label="Plan view of the thesis wing with fibre angle theta and the fixed support at the root"><defs><clipPath id="' + id + '"><rect x="70" y="70" width="280" height="100"/></clipPath></defs>' +
      '<rect class="e-fill2" x="70" y="70" width="280" height="100"/><path class="e-th" clip-path="url(#' + id + ')" d="' + hatch + '"/><rect class="e-ln" x="70" y="70" width="280" height="100"/>' +
      '<path class="e-ln" d="M66,60V180"/><path class="e-th" d="' + ticks + '" style="stroke-opacity:.8"/>' +
      '<path class="e-ax" d="M' + A[0] + ',' + A[1] + 'H262"/><path class="e-acc" d="M' + A[0] + ',' + A[1] + 'L' + f1(A[0] + 110 * Math.cos(th)) + ',' + f1(A[1] - 110 * Math.sin(th)) + '"/><path class="e-acc" d="' + arc + '"/>' +
      '<text class="e-it" x="' + f1(A[0] + 50) + '" y="' + f1(A[1] - 8) + '">θ</text><text class="e-lb" x="268" y="152">span</text>' +
      '<text class="e-lb" x="16" y="200">Fixed support</text><text class="e-lb" x="16" y="216">at the root</text>' +
      '<path class="e-dim" d="M70,56H350M70,51v10M350,51v10"/><text class="e-lb" x="210" y="48" text-anchor="middle">simplified rectangular wing</text>' +
      '<path class="e-th" style="stroke-opacity:.7" d="' + fan([214, 250], 50) + '"/><path class="e-acc" d="M214,250L' + f1(214 + 50 * Math.cos(Math.PI / 4)) + ',' + f1(250 - 50 * Math.sin(Math.PI / 4)) + 'M214,250L' + f1(214 + 50 * Math.cos(Math.PI / 4)) + ',' + f1(250 + 50 * Math.sin(Math.PI / 4)) + '"/>' +
      '<text class="e-lba" x="276" y="246">θ = −45° to +45°</text><text class="e-lb" x="276" y="263">5° steps, 19 lay-ups</text></svg>';
    return svg + '<figcaption>Plan view of the thesis wing: the outer ply’s fibre angle θ was varied, with the root fixed.</figcaption>';
  }
  if (kind === 'modes') {
    const panel = (y0, wn, z, tEnd, label, endLabel) => {
      const wd = wn * Math.sqrt(1 - z * z), x0 = 52, w = 344, amp = 34;
      let d = ''; for (let i = 0; i <= 240; i++) { const t = tEnd * i / 240, v = Math.exp(-z * wn * t) * Math.cos(wd * t); d += (i ? 'L' : 'M') + f1(x0 + w * i / 240) + ',' + f1(y0 - amp * v); }
      return '<path class="e-dim" d="M' + x0 + ',' + (y0 - 44) + 'V' + (y0 + 44) + '"/><path class="e-ax" d="M' + x0 + ',' + y0 + 'H' + (x0 + w) + '"/><path class="e-ln" style="stroke-width:1.8" d="' + d + '"/>' +
        '<text class="e-lba" x="' + (x0 + 8) + '" y="' + (y0 - 50) + '">' + label + '</text><text class="e-lb" x="' + (x0 - 6) + '" y="' + (y0 + 60) + '">0 s</text><text class="e-lb" x="' + (x0 + w) + '" y="' + (y0 + 60) + '" text-anchor="end">' + endLabel + '</text>';
    };
    return '<svg class="eng" viewBox="0 0 420 300" role="img" aria-label="Damped responses of the short-period and phugoid modes">' +
      panel(78, 5.344, .702, 3, 'Short period: ωn 5.344 rad/s, ζ 0.702', '3 s') + panel(214, .2127, .106, 120, 'Phugoid: ωn 0.2127 rad/s, ζ 0.106', '120 s') +
      '</svg><figcaption>The two longitudinal modes, drawn from the natural frequency and damping ratio computed in the coursework.</figcaption>';
  }
  if (kind === 'planform') {
    const sc = 20, cx = 150, nose = 30, rootLE = nose + 5.5 * sc, cr = 3.5 * sc, ct = 1.0 * sc, half = 4 * sc, tipLE = rootLE + 2 * sc;
    const wing = [[cx, rootLE], [cx + half, tipLE], [cx + half, tipLE + ct], [cx, rootLE + cr], [cx - half, tipLE + ct], [cx - half, tipLE]];
    const tail = nose + 12 * sc;
    const fus = 'M150,' + nose + 'C158,48 162,72 162,100L162,' + (tail - 8) + 'L156,' + tail + 'H144L138,' + (tail - 8) + 'L138,100C138,72 142,48 150,' + nose + 'Z';

      '<path class="e-dim" d="M' + (cx - half) + ',' + (tipLE - 4) + 'V' + (rootLE - 26) + 'M' + (cx + half) + ',' + (tipLE - 4) + 'V' + (rootLE - 26) + 'M' + (cx - half) + ',' + (rootLE - 20) + 'H' + (cx + half) + '"/>' +
      '<path class="e-ar" d="M' + (cx - half) + ',' + (rootLE - 20) + 'l7,-3.5v7zM' + (cx + half) + ',' + (rootLE - 20) + 'l-7,-3.5v7z"/>' +
      '<rect x="' + (cx - 72) + '" y="' + (rootLE - 36) + '" width="44" height="14" fill="#FAFBFD"/><text class="e-lb" x="' + (cx - 50) + '" y="' + (rootLE - 25) + '" text-anchor="middle">8.0 m</text>' +
      '<path class="e-dim" d="M156,' + nose + 'H276M160,' + tail + 'H276M268,' + nose + 'V' + tail + '"/><path class="e-ar" d="M268,' + nose + 'l-3.5,7h7zM268,' + tail + 'l-3.5,-7h7z"/>' +
      '<text class="e-lb" x="276" y="' + (nose + (tail - nose) / 2 - 6) + '">12.0 m</text><text class="e-lb" x="276" y="' + (nose + (tail - nose) / 2 + 10) + '">length</text>' +
      '<text class="e-lba" x="300" y="226">S = 18.0 m²</text><text class="e-lba" x="300" y="244">AR = 3.56</text><text class="e-lba" x="300" y="262">λ = 0.286</text></svg>' +
      '<figcaption>Top view redrawn from the stated span, length, area and taper ratio. Sweep and fuselage shape are illustrative.</figcaption>';
  }
  return '';
}

/* ---------- behaviour ---------- */
const nav = $('#nav'), menuBtn = $('#menu-btn');
const setMenu = open => { nav.classList.toggle('open', open); menuBtn.setAttribute('aria-expanded', String(open)); menuBtn.setAttribute('aria-label', open ? 'Close the section menu' : 'Open the section menu'); };
menuBtn.addEventListener('click', () => setMenu(!nav.classList.contains('open')));
nav.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });

const navLinks = [...nav.querySelectorAll('a')];
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => { es.forEach(en => { if (en.isIntersecting) { const id = en.target.id; navLinks.forEach(a => { const on = a.getAttribute('href') === '#' + id; a.classList.toggle('on', on); if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); }); } }); }, {rootMargin:'-45% 0px -50% 0px'});
  document.querySelectorAll('#sections > .sec').forEach(s => io.observe(s));
}

const toastEl = $('#toast'); let tt;
const toast = t => { toastEl.textContent = t; toastEl.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove('show'), 2400); };

const dlg = $('#dlg'), dbody = $('#dlg-body');
function openDialog(html) {
  dbody.innerHTML = html;
  if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  dlg.scrollTop = 0;
}
function openProject(id) {
  const p = (S.projects || []).find(x => x.id === id); if (!p) return;
  const h = '<div class="d-art">' + projArt(p) + '</div><div class="d-body"><p class="type">' + esc(plain(p.type)) + '</p><h2 id="dlg-title">' + esc(p.title) + '</h2>' +
    (p.tags && p.tags.length ? '<div class="tags">' + p.tags.map(t => '<span>' + esc(t) + '</span>').join('') + '</div>' : '') +
    '<p>' + esc(p.description) + '</p>' +
    (p.outcome ? '<h3>Outcome</h3><p>' + esc(p.outcome) + '</p>' : '') +
    (p.metrics && p.metrics.length ? '<h3>Key numbers</h3>' + metricsHTML(p.metrics) : '') +
    (p.steps && p.steps.length ? '<h3>The steps, in order</h3><ol class="steps">' + p.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>' : '') +
    (p.rules && p.rules.length ? '<h3>Data-quality rules</h3><table><thead><tr><th>Issue</th><th>Rows</th><th>Rule</th></tr></thead><tbody>' + p.rules.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join('') + '</tbody></table>' : '') +
    (p.logLines && p.logLines.length ? '<h3>The run log</h3><pre>' + esc(p.logLines.join('\n')) + '</pre>' : '') +
    (p.journey ? '<h3>Where it fits</h3><p>' + esc(p.journey) + '</p>' : '') +
    (p.ai ? '<p class="caveat">' + esc(p.ai) + '</p>' : '') +
    '<div class="d-acts"><a class="btn btn-ink" href="' + esc(repoUrl(p)) + '"' + ext(repoUrl(p)) + '>' + icon('github') + 'Open the repository</a>' + (p.video ? '<a class="btn btn-ghost" href="' + esc(p.video) + '"' + ext(p.video) + '>' + icon('play') + 'Watch the video</a>' : '') + '</div></div>';
  openDialog(h);
}
function openPost(id) {
  const p = (S.posts || []).find(x => x.id === id); if (!p) return;
  openDialog('<div class="d-body reader"><p class="type">' + esc(p.category) + ', ' + esc(fmtDate(p.date)) + '</p><h2 id="dlg-title">' + esc(p.title) + '</h2><p class="lead">' + esc(p.excerpt) + '</p>' + (p.body || []).map(t => '<p class="bp">' + esc(t) + '</p>').join('') + '</div>');
}
$('#dlg-x').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) { const r = dlg.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlg.close(); } });

document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { openProject(o.dataset.open); return; }
  const po = e.target.closest('[data-post]'); if (po) { openPost(po.dataset.post); return; }
  const f = e.target.closest('[data-filter]');
  if (f) {
    const cat = f.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(b => b.setAttribute('aria-pressed', String(b === f)));
    let n = 0; document.querySelectorAll('.reg tbody tr').forEach(tr => { const show = cat === 'All' || tr.dataset.cat === cat; tr.hidden = !show; if (show) n++; });
    $('#reg-count').textContent = cat === 'All' ? 'Showing all ' + n + ' projects' : 'Showing ' + n + (n === 1 ? ' project' : ' projects') + ' in ' + cat;
    return;
  }
  const c = e.target.closest('[data-copy]');
  if (c) {
    const v = c.dataset.copy;
    const done = () => toast('Email address copied');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(done, () => window.prompt('Copy the email address:', v));
    else window.prompt('Copy the email address:', v);
  }
});
})();
</script>
</body>
</html>
