<style>
/* =====================================================================
   Design: an aerospace drawing sheet. Navy and champagne gold on
   drafting-film white. Gold lines are engineering; blue lines are the
   machine-learning layer, everywhere on the page.
   Spectral for headings, IBM Plex Sans for text, Plex Sans Condensed
   for drawing annotations. All words come from content.js.
   ===================================================================== */
:root{
  --navy:#0B1A33; --navy-2:#11233F; --navy-3:#1A3158; --navy-4:#22406E;
  --gold:#D9B66E; --gold-2:#EBD5A4; --gold-ink:#86601C; --gold-wash:#F6EEDC;
  --cyan:#6CC4D8; --cyan-2:#A9E0EC; --cyan-ink:#17697B; --cyan-wash:#E4F3F7;
  --film:#F1F3F6; --sheet:#FFFFFF; --ink:#0E1A2E; --ink-2:#2A3650; --muted:#56607A;
  --rule:#D3D9E3; --rule-2:#E6EAF0;
  --on-navy:#DDE3EE; --on-navy-2:#A4AFC4; --line-navy:rgba(217,182,110,.3);
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans","Arial Narrow",sans-serif;
  --wrap:1200px; --pad:clamp(18px,4vw,40px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:74px}
body{margin:0;background:var(--film);color:var(--ink);font:400 17px/1.65 var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--serif);font-weight:500;margin:0;line-height:1.15}
p{margin:0}
a{color:inherit}
img{max-width:100%;display:block}
ul,ol{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:12px;top:-80px;z-index:100;background:var(--gold);color:var(--navy);padding:10px 16px;font-weight:600;text-decoration:none;border-radius:3px}
.skip:focus{top:12px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 var(--pad)}
.ico{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.lg{width:26px;height:26px;flex:none;display:block}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg text{font-family:var(--cond)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(11,26,51,.97);color:var(--on-navy);border-bottom:1px solid rgba(217,182,110,.22)}
@supports (backdrop-filter:blur(8px)){.topbar{background:rgba(11,26,51,.86);backdrop-filter:blur(12px) saturate(1.2)}}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;margin-right:auto;min-width:0}
.mark{width:36px;height:36px;flex:none;display:grid;place-items:center;border:1px solid var(--gold);border-radius:2px;font:500 15px/1 var(--serif);color:var(--gold-2);letter-spacing:.04em}
.brand b{font:500 18px/1.1 var(--serif);color:#F6F1E6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:0}
.nav a{font:500 14.5px/1 var(--sans);color:#BFC8D8;text-decoration:none;padding:10px 9px;border-radius:2px}
.nav a:hover{color:#fff}
.nav a.on{color:var(--gold-2);box-shadow:inset 0 -2px 0 var(--gold)}
.menu-btn{display:none;width:42px;height:42px;place-items:center;border:1px solid rgba(217,182,110,.4);border-radius:3px;color:var(--gold-2)}
@media (max-width:1180px){
  .menu-btn{display:grid}
  .nav{position:fixed;left:0;right:0;top:64px;flex-direction:column;align-items:stretch;background:var(--navy);padding:8px var(--pad) 20px;border-bottom:1px solid rgba(217,182,110,.3);display:none;max-height:calc(100vh - 64px);overflow:auto}
  .nav.open{display:flex}
  .nav a{padding:15px 4px;font-size:17px;border-bottom:1px solid rgba(217,182,110,.14)}
  .nav a.on{box-shadow:none}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:9px;font:600 15px/1 var(--sans);padding:14px 20px;border-radius:3px;text-decoration:none;border:1px solid transparent;transition:background-color .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-gold{background:var(--gold);color:var(--navy)}
.btn-gold:hover{background:var(--gold-2)}
.btn-line{border-color:rgba(235,213,164,.55);color:var(--gold-2)}
.btn-line:hover{background:rgba(217,182,110,.12);border-color:var(--gold-2)}
.btn-ink{background:var(--navy);color:#fff}
.btn-ink:hover{background:var(--navy-3)}
.btn-ghost{background:var(--sheet);border-color:var(--rule);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink)}
.btn-yt{background:#C4302B;color:#fff}
.btn-yt:hover{background:#A92722}
.btn-sm{padding:10px 14px;font-size:14px}
.btn-mail{padding:10px 15px;font-size:14px}
@media (max-width:520px){.btn-mail span{display:none}}

/* ---------- hero: the drawing sheet ---------- */
.hero{background:var(--navy);color:var(--on-navy);padding:26px 0 56px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(217,182,110,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(217,182,110,.045) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
.sheet{position:relative;border:1px solid rgba(217,182,110,.4);padding:clamp(34px,5vw,58px) clamp(22px,3.6vw,48px) clamp(30px,4vw,44px)}
.sheet::after{content:"";position:absolute;inset:8px;border:1px solid rgba(217,182,110,.13);pointer-events:none}
.zone{position:absolute;font:500 11px/1 var(--cond);color:rgba(235,213,164,.45)}
.zone.t{top:-1px;transform:translate(-50%,-140%)}
.zone.b{bottom:-1px;transform:translate(-50%,140%)}
.zone.l{left:-1px;transform:translate(-160%,-50%)}
.zone.r{right:-1px;transform:translate(160%,-50%)}
.hero-grid{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.06fr);gap:clamp(26px,4vw,58px);align-items:start}
.hero h1{font:500 clamp(42px,4.9vw,70px)/1 var(--serif);color:#F6F1E6;letter-spacing:-.018em}
.roles{margin-top:20px;display:grid;gap:8px}
.roles li{display:flex;align-items:center;gap:14px;font:500 clamp(19px,1.9vw,23px)/1.25 var(--sans);color:#F2EBDD}
.roles i{width:34px;height:0;border-top:3px solid var(--gold);flex:none}
.roles li.ai i{border-color:var(--cyan)}
.hero .lede{margin-top:22px;font-size:16.5px;line-height:1.66;color:#C6CEDD;max-width:62ch}
.hero .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.socials{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.socials a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 13px;border:1px solid rgba(217,182,110,.28);border-radius:3px;color:#C6CEDD;text-decoration:none;font-size:14px}
.socials a:hover{color:#fff;border-color:var(--gold)}
.socials svg{width:17px;height:17px}
.drawing{margin:0}
.drawing svg{display:block;width:100%;height:auto}
.drawing figcaption{margin-top:8px;font:400 13.5px/1.5 var(--cond);color:#97A3BA;max-width:70ch}
.tblock{margin-top:20px;display:grid;grid-template-columns:112px minmax(0,1fr);border:1px solid rgba(217,182,110,.5);background:rgba(17,35,63,.78)}
.tblock img{width:112px;height:100%;min-height:150px;object-fit:cover;object-position:50% 18%;border-right:1px solid rgba(217,182,110,.5)}
.tb-name{font:500 19px/1.2 var(--serif);color:#F6F1E6;padding:10px 14px;border-bottom:1px solid rgba(217,182,110,.32)}
.tblock dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr)}
.tblock dt,.tblock dd{padding:7px 12px;border-bottom:1px solid rgba(217,182,110,.17)}
.tblock dt{font:500 12.5px/1.4 var(--cond);color:var(--gold);border-right:1px solid rgba(217,182,110,.17);padding-left:14px}
.tblock dd{margin:0;font-size:14px;line-height:1.4;color:#DCE2EC}
.tblock dt:last-of-type,.tblock dd:last-of-type{border-bottom:0}
@media (max-width:980px){.hero-grid{grid-template-columns:minmax(0,1fr);gap:0}.hero-grid>div{display:contents}.zone{display:none}.o1{order:1}.o2{order:2}.o3{order:3;margin-top:26px!important}.o4{order:4}.o5{order:5}.o6{order:6}.o7{order:7}}
@media (max-width:520px){.tblock{grid-template-columns:88px minmax(0,1fr)}.tblock img{width:88px}.tblock dl{grid-template-columns:minmax(0,1fr)}.tblock dt{border-right:0;border-bottom:0;padding-bottom:0}}

/* hero drawing styles and the one load sequence */
.hd .ol{fill:none;stroke:var(--gold);stroke-width:1.5;stroke-linejoin:round}
.hd .fuse{fill:#0F2443;stroke:var(--gold);stroke-width:1.5}
.hd .thin{fill:none;stroke:var(--gold);stroke-width:.9}
.hd .mesh{fill:none;stroke:var(--gold);stroke-width:.6;opacity:.5}
.hd .hid{fill:none;stroke:var(--gold);stroke-width:.9;stroke-dasharray:5 3;opacity:.7}
.hd .cl{stroke:rgba(235,213,164,.55);stroke-width:.8;stroke-dasharray:14 4 2 4}
.hd .dim{stroke:var(--gold-2);stroke-width:.9;fill:none}
.hd .ext{stroke:rgba(235,213,164,.55);stroke-width:.7}
.hd .t{fill:#E9DDBF;font-size:13px}
.hd .ts{fill:#B8C1D3;font-size:11.5px}
.hd .tb{fill:#F2E7C9;font-size:15px;font-weight:600}
.hd .pan{fill:rgba(11,26,51,.55);stroke:rgba(217,182,110,.45);stroke-width:1}
.hd .ply{fill:rgba(217,182,110,.1);stroke:var(--gold);stroke-width:1}
.hd .core{fill:rgba(217,182,110,.04);stroke:var(--gold);stroke-width:1;stroke-dasharray:3 2}
.hd .fib{stroke:var(--gold);stroke-width:.8;opacity:.75}
.hd .net{stroke:var(--cyan);stroke-width:.7;opacity:.42}
.hd .nd{fill:#0F2443;stroke:var(--cyan);stroke-width:1.4}
.hd .ndt{fill:var(--cyan-2);font-size:11px;font-weight:600}
.hd .cy{fill:var(--cyan-2)}
.hd .cyl{stroke:var(--cyan);stroke-width:1.1;fill:none;stroke-dasharray:4 3}
.hd .cytitle{fill:var(--cyan-2);font-size:13px}
.hd .air{fill:rgba(217,182,110,.08);stroke:var(--gold);stroke-width:1.2}
@media (prefers-reduced-motion:no-preference){
  .hd .dr{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s cubic-bezier(.55,.1,.3,1) forwards;animation-delay:var(--d,0s)}
  .hd .fd{opacity:0;animation:fade .7s ease forwards;animation-delay:var(--d,0s)}
  .hd .mesh.fd{animation-name:fademesh}
  .hd .net.fd{animation-name:fadenet}
  .hd .hid.fd{animation-name:fadehid}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes fade{to{opacity:1}}
  @keyframes fademesh{to{opacity:.5}}
  @keyframes fadenet{to{opacity:.42}}
  @keyframes fadehid{to{opacity:.7}}
}

/* ---------- route map ---------- */
.route{background:var(--navy-2);color:var(--on-navy);padding:56px 0 64px;border-top:1px solid rgba(217,182,110,.16)}
.route h2{font-size:clamp(28px,3.2vw,38px);color:#F6F1E6}
.route .sub{color:var(--on-navy-2);margin-top:6px}
.route-map{margin-top:22px}
.route-map svg{display:block;width:100%;height:auto}
@media (max-width:640px){.route-map .rc{font-size:38px}.route-map .rcity{font-size:27px;transform:translateY(17px)}}
.legs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:22px;border:1px solid rgba(217,182,110,.28)}
.leg{padding:18px 18px 20px;border-right:1px solid rgba(217,182,110,.2)}
.leg:last-child{border-right:0;background:rgba(108,196,216,.06)}
.leg .lh{display:flex;align-items:center;gap:10px;font:500 13px/1.3 var(--cond);color:var(--gold-2)}
.leg .num{width:24px;height:24px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;font:600 12px/1 var(--cond);color:var(--gold-2);flex:none}
.leg:last-child .num{border-color:var(--cyan);color:var(--cyan-2)}
.leg h3{font-size:20px;color:#F6F1E6;margin-top:10px}
.leg p{font-size:14.5px;line-height:1.55;color:#BAC3D4;margin-top:8px}
@media (max-width:900px){.legs{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.leg:nth-child(2){border-right:0}.leg:nth-child(-n+2){border-bottom:1px solid rgba(217,182,110,.2)}}
@media (max-width:560px){.legs{grid-template-columns:minmax(0,1fr)}.leg{border-right:0;border-bottom:1px solid rgba(217,182,110,.2)}}

/* ---------- sections ---------- */
.sec{padding:clamp(64px,8vw,96px) 0;border-top:1px solid var(--rule-2)}
.sec.tint{background:var(--sheet)}
.sec.dark{background:var(--navy);color:var(--on-navy);border-top:0}
.sec-grid{display:grid;grid-template-columns:250px minmax(0,1fr);gap:clamp(28px,4.5vw,64px);align-items:start}
.rail{position:sticky;top:96px}
.rail .gl{width:46px;height:46px;color:var(--gold-ink);fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;display:block;margin-bottom:16px}
.dark .rail .gl{color:var(--gold)}
.rail h2{font-size:clamp(32px,3.6vw,44px);letter-spacing:-.01em}
.dark .rail h2{color:#F6F1E6}
.rail p{margin-top:12px;color:var(--muted);font-size:16px;line-height:1.55}
.dark .rail p{color:var(--on-navy-2)}
.body>*+*{margin-top:clamp(40px,5vw,56px)}
.sub-h{font-size:clamp(22px,2.3vw,27px)}
.sub-h+*{margin-top:18px}
.dark .sub-h{color:#F6F1E6}
.note{color:var(--muted);font-size:15.5px;margin-top:6px}
.dark .note{color:var(--on-navy-2)}
.prose{font-size:17.5px;line-height:1.72;max-width:68ch;color:var(--ink-2)}
.dark .prose{color:#C9D1DF}
@media (max-width:980px){.sec-grid{grid-template-columns:minmax(0,1fr)}.rail{position:static}.rail .gl{width:40px;height:40px}}

/* drafting frame: corner ticks on key panels */
.frame{position:relative;border:1px solid var(--rule);background:var(--sheet)}
.frame::before{content:"";position:absolute;inset:-1px;pointer-events:none;background:
  linear-gradient(var(--gold),var(--gold)) top left/16px 2px no-repeat,
  linear-gradient(var(--gold),var(--gold)) top left/2px 16px no-repeat,
  linear-gradient(var(--gold),var(--gold)) bottom right/16px 2px no-repeat,
  linear-gradient(var(--gold),var(--gold)) bottom right/2px 16px no-repeat}
.dark .frame{background:var(--navy-2);border-color:rgba(217,182,110,.28)}

.chip{display:inline-flex;align-items:center;gap:6px;font:500 12.5px/1 var(--cond);padding:5px 9px;border-radius:2px;border:1px solid var(--rule);color:var(--ink-2);background:var(--sheet);white-space:nowrap}
.chip.now{border-color:var(--cyan-ink);color:var(--cyan-ink);background:var(--cyan-wash)}
.chip.next{border-color:var(--rule);color:var(--muted)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:14px 0 0;font-size:14.5px}
.facts dt{font:500 13px/1.6 var(--cond);color:var(--gold-ink)}
.facts dd{margin:0;color:var(--ink-2);line-height:1.6}
.dark .facts dt{color:var(--gold)}
.dark .facts dd{color:#C9D1DF}
.ticks li{position:relative;padding-left:20px;margin-top:9px;font-size:15.5px;line-height:1.6;color:var(--ink-2)}
.ticks li::before{content:"";position:absolute;left:0;top:.72em;width:9px;height:1.5px;background:var(--gold)}
.ticks li.lim{color:var(--muted)}
.ticks li.lim::before{background:var(--muted)}
.dark .ticks li{color:#C9D1DF}
.lk{display:inline-flex;align-items:center;gap:7px;font:600 14.5px/1.2 var(--sans);color:var(--gold-ink);text-decoration:none;border-bottom:1px solid rgba(134,96,28,.35);padding-bottom:2px}
.lk:hover{border-color:var(--gold-ink)}
.dark .lk{color:var(--gold-2);border-color:rgba(235,213,164,.35)}
figure{margin:0}
.ph{position:relative;overflow:hidden;background:var(--navy-2);cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
.ph:hover img{transform:scale(1.03)}
.cap{font:400 13.5px/1.45 var(--cond);color:var(--muted);margin-top:8px}
.dark .cap{color:var(--on-navy-2)}

/* ---------- engineering ---------- */
.eng-intro{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:32px;align-items:start}
.assess{padding:22px 22px 20px;display:grid;grid-template-columns:86px minmax(0,1fr);gap:16px;align-items:center}
.assess svg{width:86px;height:86px}
.assess h3{font-size:19px}
.assess .code{font:600 14px/1.3 var(--cond);color:var(--gold-ink);margin-top:4px}
.assess p{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin-top:8px;grid-column:1/-1}
.eng-sheet{display:block}
.eng-sheet+.eng-sheet{margin-top:28px}
.eng-art{background:var(--navy);display:flex;flex-direction:column;align-items:center;background-image:linear-gradient(rgba(217,182,110,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(217,182,110,.05) 1px,transparent 1px);background-size:24px 24px}
.eng-art svg{display:block;width:100%;max-width:660px;height:auto;padding:10px 6px 0}
.eng-art .scr{width:100%}
.eng-art .scr svg{margin:0 auto}
.eng-art .sheetno{align-self:stretch;display:flex;justify-content:space-between;gap:10px;border-top:1px solid rgba(217,182,110,.3);padding:8px 14px;font:500 12.5px/1.3 var(--cond);color:#9FAAC0;margin-top:auto}
.eng-txt{padding:26px 28px 28px}
.eng-sheet .eng-txt{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:6px 36px}
.eng-sheet .ticks li:first-child{margin-top:0}
@media (max-width:860px){.eng-sheet .eng-txt{grid-template-columns:minmax(0,1fr)}.eng-sheet .ticks{margin-top:8px}}
.eng-txt h3{font-size:clamp(22px,2.2vw,26px)}
.eng-txt>p{margin-top:12px;font-size:16px;color:var(--ink-2)}
.eng-txt .facts{margin-bottom:6px}
.train{display:grid;grid-template-columns:300px minmax(0,1fr);gap:0}
.train .ph{min-height:300px}

.vlist .th::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-40%,-50%);border-left:12px solid #fff;border-top:8px solid transparent;border-bottom:8px solid transparent;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.vlist b{display:block;font:600 14.5px/1.35 var(--sans)}
.vlist small{display:block;font:400 13px/1.35 var(--cond);color:var(--muted);margin-top:3px}
@media (max-width:900px){.vid{grid-template-columns:minmax(0,1fr)}}
.posts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.post{display:grid;grid-template-columns:52px minmax(0,1fr);gap:16px;padding:18px;background:var(--sheet);border:1px solid var(--rule);text-align:left;width:100%;transition:border-color .15s}
.post:hover{border-color:var(--ink)}
.post .pg{width:52px;height:52px;border-radius:2px;background:var(--navy);color:var(--gold-2);display:grid;place-items:center}
.post .pg svg{width:26px;height:26px}
.post .ty{font:500 13px/1.3 var(--cond);color:var(--gold-ink)}
.post h4{font:500 18.5px/1.3 var(--serif);margin-top:4px}
.post p{font-size:14.5px;line-height:1.55;color:var(--muted);margin-top:8px}
@media (max-width:760px){.posts{grid-template-columns:minmax(0,1fr)}}

/* ---------- beyond the desk ---------- */
.lg-group{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.lg-group+.lg-group{margin-top:44px;padding-top:44px;border-top:1px solid var(--rule)}
.lg-group h3{font-size:24px}
.lg-group>div>p{font-size:15.5px;line-height:1.65;color:var(--ink-2);margin-top:10px}
.mosaic{display:grid;gap:12px;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));align-items:start}
.mosaic .ph{aspect-ratio:var(--ar,4/3)}
@media (max-width:900px){.lg-group{grid-template-columns:minmax(0,1fr);gap:16px}}
@media (max-width:560px){.mosaic{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.mosaic figure:first-child:nth-last-child(odd){grid-column:1/-1}}

/* ---------- contact (dark) ---------- */
.contact-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:36px;align-items:center}
.contact-grid h2{font-size:clamp(36px,4.4vw,56px);color:#F6F1E6}
.contact-grid p{font-size:17.5px;line-height:1.7;color:#C9D1DF;margin-top:16px;max-width:52ch}
.contact-grid .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.contact-grid .mail{font:500 15px/1.4 var(--cond);color:var(--gold-2);margin-top:16px}
.contact-art svg{display:block;width:100%;height:auto}
@media (max-width:900px){.contact-grid{grid-template-columns:minmax(0,1fr)}}

/* ---------- footer ---------- */
.foot{background:#08142A;color:#8E9AB2;font-size:14px;padding:22px 0}
.foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.foot a{color:#C6CEDD}

/* ---------- dialog ---------- */
.dlg{width:min(940px,calc(100vw - 24px));max-height:calc(100vh - 40px);padding:0;border:1px solid var(--rule);border-radius:3px;background:var(--sheet);color:var(--ink);box-shadow:0 30px 80px rgba(5,12,28,.45)}
.dlg::backdrop{background:rgba(5,12,28,.72)}
.dlg .x{position:sticky;top:12px;float:right;margin:12px 12px -52px 0;z-index:2;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.94);border:1px solid var(--rule)}
.d-art{background:var(--navy)}
.d-art svg{display:block;width:100%;height:auto;max-height:340px}
.d-body{padding:26px clamp(20px,4vw,36px) 32px}
.d-body .type{font:500 13.5px/1.3 var(--cond);color:var(--gold-ink)}
.d-body h2{font-size:clamp(26px,3.4vw,34px);margin-top:6px}
.d-body h3{font:600 15px/1.3 var(--sans);margin-top:22px}
.d-body p{font-size:16px;line-height:1.68;color:var(--ink-2);margin-top:10px}
.metrics{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.metrics li{font:600 13.5px/1 var(--cond);padding:8px 11px;background:var(--navy);color:var(--gold-2);border-radius:2px}
.steps{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.steps li{font-size:13.5px;padding:6px 10px;border:1px solid var(--rule);border-radius:2px;background:var(--film)}
.rules{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px}
.rules th,.rules td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.rules th{font:500 13px/1.3 var(--cond);color:var(--gold-ink)}
.logl{background:var(--navy);color:#CFE6EC;font:400 13px/1.7 var(--cond);padding:12px 14px;margin-top:10px;border-radius:2px;overflow:auto}
.caveat{font-size:14.5px!important;color:var(--muted)!important;border-left:2px solid var(--gold);padding-left:12px}
.d-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.reader p.bp{font-size:17px;line-height:1.75}
.lb{background:#05101F}
.lb img{width:100%;max-height:calc(100vh - 140px);object-fit:contain}
.lb .lbc{padding:12px 18px 16px;color:#C9D1DF;font:400 14.5px/1.5 var(--sans)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

  return '';
}

  for (let lat = 30; lat >= -30; lat -= 15) s += '<line x1="20" y1="' + py(lat) + '" x2="' + (W - 10) + '" y2="' + py(lat) + '"' + (lat === 0 ? ' stroke="rgba(217,182,110,.32)"' : '') + '/>';
  s += '</g><g fill="#7E8AA3" font-size="15">';
  [90, 110, 130].forEach(l => { s += '<text x="' + (px(l) + 5) + '" y="' + (H - 10) + '">' + l + '°E</text>'; });
  s += '<text x="104" y="' + (py(0) - 6) + '">Equator</text></g>';

  let legs = '';

    const a = pts[i - 1], b = pts[i];
    const ax = px(a.lon), ay = py(a.lat), bx2 = px(b.lon), by2 = py(b.lat);

    // a small aircraft at the middle of each leg, pointing along it
    const t = .5, qx = (1 - t) * (1 - t) * ax + 2 * (1 - t) * t * mx + t * t * bx2, qy = (1 - t) * (1 - t) * ay + 2 * (1 - t) * t * my + t * t * by2;
    const dx = 2 * (1 - t) * (mx - ax) + 2 * t * (bx2 - mx), dy = 2 * (1 - t) * (my - ay) + 2 * t * (by2 - my);

  }
  const stop = (p, dx, dy, anchor) => '<circle cx="' + px(p.lon) + '" cy="' + py(p.lat) + '" r="13" fill="none" stroke="rgba(217,182,110,.5)"/><circle cx="' + px(p.lon) + '" cy="' + py(p.lat) + '" r="5.5" fill="#EBD5A4"/>' +
    '<text x="' + (px(p.lon) + dx) + '" y="' + (py(p.lat) + dy) + '" text-anchor="' + anchor + '" fill="#F6F1E6" font-size="24" class="rc" font-family="Spectral,Georgia,serif">' + esc(p.code) + '</text>' +

/* ===================================================================

   =================================================================== */
function modelArt(kind) {
  let s = '';
  if (kind === 'logistic') {
    let p = []; for (let i = 0; i <= 40; i++) { const x = -6 + i * .3, y = 1 / (1 + Math.exp(-x)); p.push(r1(14 + i * 2.3) + ',' + r1(60 - y * 46)); }
    s += '<line x1="12" y1="60" x2="110" y2="60" stroke="rgba(221,227,238,.4)"/><polyline points="' + p.join(' ') + '" fill="none" stroke="#6CC4D8" stroke-width="2"/>';
    [20, 30, 38, 46, 55].forEach(x => { s += '<circle cx="' + x + '" cy="58" r="2.4" fill="#D9B66E"/>'; }); [68, 77, 86, 95, 104].forEach(x => { s += '<circle cx="' + x + '" cy="16" r="2.4" fill="#A9E0EC"/>'; });
  } else if (kind === 'forest') {
    [[22, .9], [60, 1], [98, .9]].forEach(([x, sc]) => {
      const n = (a, b) => '<circle cx="' + a + '" cy="' + b + '" r="3.4" fill="#0B1A33" stroke="#6CC4D8" stroke-width="1.2"/>';
      s += '<path d="M' + x + ',14 L' + (x - 12) + ',34 M' + x + ',14 L' + (x + 12) + ',34 M' + (x - 12) + ',34 L' + (x - 18) + ',54 M' + (x - 12) + ',34 L' + (x - 6) + ',54 M' + (x + 12) + ',34 L' + (x + 18) + ',54" stroke="#6CC4D8" stroke-width="1" fill="none"/>' + n(x, 14) + n(x - 12, 34) + n(x + 12, 34) + n(x - 18, 54) + n(x - 6, 54) + n(x + 18, 54);
    });
  } else if (kind === 'kmeans') {
    const R = rng(77); [[30, 26, '#6CC4D8'], [82, 22, '#D9B66E'], [60, 52, '#A9E0EC']].forEach(([x, y, c]) => { for (let i = 0; i < 12; i++) { const a = R() * 6.283, r = Math.sqrt(R()) * 13; s += '<circle cx="' + r1(x + Math.cos(a) * r) + '" cy="' + r1(y + Math.sin(a) * r * .8) + '" r="2" fill="' + c + '"/>'; } s += '<path d="M' + (x - 4) + ',' + y + 'h8M' + x + ',' + (y - 4) + 'v8" stroke="#F6F1E6" stroke-width="1.5"/>'; });
  } else if (kind === 'rfm') {
    const o = [44, 18], d = 14, dx = 9, dy = -6;
    for (let i = 0; i <= 3; i++) { s += '<line x1="' + (o[0]) + '" y1="' + (o[1] + 20 + i * d) + '" x2="' + (o[0] + 3 * d) + '" y2="' + (o[1] + 20 + i * d) + '" stroke="#D9B66E" stroke-width=".8"/><line x1="' + (o[0] + i * d) + '" y1="' + (o[1] + 20) + '" x2="' + (o[0] + i * d) + '" y2="' + (o[1] + 20 + 3 * d) + '" stroke="#D9B66E" stroke-width=".8"/>'; }
    for (let i = 0; i <= 3; i++) { s += '<line x1="' + (o[0] + i * d) + '" y1="' + (o[1] + 20) + '" x2="' + (o[0] + i * d + 3 * dx) + '" y2="' + (o[1] + 20 + 3 * dy) + '" stroke="#D9B66E" stroke-width=".6" opacity=".7"/><line x1="' + (o[0] + 3 * d) + '" y1="' + (o[1] + 20 + i * d) + '" x2="' + (o[0] + 3 * d + 3 * dx) + '" y2="' + (o[1] + 20 + i * d + 3 * dy) + '" stroke="#D9B66E" stroke-width=".6" opacity=".7"/>'; }
    s += '<line x1="' + o[0] + '" y1="' + (o[1] + 20) + '" x2="' + (o[0] + 3 * dx) + '" y2="' + (o[1] + 20 + 3 * dy) + '" stroke="#D9B66E" stroke-width=".6"/><line x1="' + (o[0] + 3 * dx) + '" y1="' + (o[1] + 20 + 3 * dy) + '" x2="' + (o[0] + 3 * d + 3 * dx) + '" y2="' + (o[1] + 20 + 3 * dy) + '" stroke="#D9B66E" stroke-width=".6"/>';
    s += '<rect x="' + (o[0] + 2 * d) + '" y="' + (o[1] + 20) + '" width="' + d + '" height="' + d + '" fill="#6CC4D8" opacity=".8"/>';
    s += '<text x="20" y="66" fill="#A9B4C8" font-size="9">R, F, M</text>';
  } else {
    s += '<line x1="8" y1="38" x2="112" y2="38" stroke="rgba(221,227,238,.45)"/><line x1="96" y1="6" x2="96" y2="70" stroke="rgba(221,227,238,.45)"/>';
    const X = (x, y) => '<path d="M' + (x - 4) + ',' + (y - 4) + 'l8,8M' + (x + 4) + ',' + (y - 4) + 'l-8,8" stroke="#D9B66E" stroke-width="2"/>';
    s += X(40, 14) + X(40, 62) + X(94, 32) + X(94, 44);
    s += '<path d="M96,38 L36,10 M96,38 L36,66" stroke="#6CC4D8" stroke-dasharray="3 3" stroke-width=".9"/>';
  }
  return '<svg viewBox="0 0 120 72" aria-hidden="true">' + s + '</svg>';
}

function sweepSVG(sw) {
  const n = (sw.to - sw.from) / sw.step, x0 = 40, w = 820, X = a => r1(x0 + (a - sw.from) / (sw.to - sw.from) * w);
  let s = '<rect x="' + X(sw.lowStress[0]) + '" y="40" width="' + r1(X(sw.lowStress[1]) - X(sw.lowStress[0])) + '" height="46" fill="rgba(108,196,216,.18)" stroke="rgba(108,196,216,.6)"/>';
  s += '<line x1="' + x0 + '" y1="86" x2="' + (x0 + w) + '" y2="86" stroke="#D9B66E" stroke-width="1.4"/>';
  for (let i = 0; i <= n; i++) { const a = sw.from + i * sw.step, x = X(a); s += '<line x1="' + x + '" y1="86" x2="' + x + '" y2="' + (a % 15 === 0 ? 70 : 76) + '" stroke="#D9B66E" stroke-width="1.2"/><circle cx="' + x + '" cy="86" r="3" fill="#0B1A33" stroke="#D9B66E"/>'; if (a % 15 === 0) s += '<text x="' + x + '" y="112" text-anchor="middle" fill="#A9B4C8" font-size="15">' + (a > 0 ? '+' : a < 0 ? '−' : '') + Math.abs(a) + '°</text>'; }
  const mk = (a, lab, up) => { const x = X(a); return '<path d="M' + x + ',' + (up ? 64 : 92) + ' l-7,' + (up ? -12 : 12) + ' h14z" fill="#F2E7C9"/><text x="' + x + '" y="' + (up ? 42 : 132) + '" text-anchor="middle" fill="#F2E7C9" font-size="15">' + lab + '</text>'; };
  s += mk(sw.maxDeformation, 'Deformation largest, −40°', true) + mk(sw.minDeformation, 'Deformation smallest, +5°', false);
  s += '<text x="' + r1((X(sw.lowStress[0]) + X(sw.lowStress[1])) / 2) + '" y="150" text-anchor="middle" fill="#A9E0EC" font-size="15">Stress lowest, −25° to −20°</text>';
  return '<svg viewBox="0 0 900 160" role="img" aria-label="My thesis sweep of 19 fibre angles from minus 45 to plus 45 degrees: deformation was largest at minus 40 degrees and smallest at plus 5 degrees; shear and equivalent stress were lowest between minus 25 and minus 20 degrees">' + s + '</svg>';
}

  let b = '<div><h3 class="sub-h">' + esc(H.title) + '</h3><article class="hon"><div class="in"><h3>' + esc(F.title) + '</h3><p>' + esc(F.text) + '</p><div class="hstats">' + F.stats.map(s => '<div><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span></div>').join('') + '</div></div>' + '<div class="ph" data-full="' + esc(H.photos[0].photo) + '" data-cap="' + esc(H.photos[0].caption) + '" role="button" tabindex="0" aria-label="Open photo: ' + esc(H.photos[0].alt) + '"><img src="' + esc(H.photos[0].photo) + '" alt="' + esc(H.photos[0].alt) + '" loading="lazy" style="object-position:30% 30%"></div></article></div>';
  b += '<div><ol class="htl">' + H.timeline.map((t, i) => '<li><p class="when">' + esc(t.when) + '</p>' + medal(/scholarship|Golden/i.test(t.title + t.text)) + '<h4>' + esc(t.title) + '</h4><p>' + esc(t.text) + '</p></li>').join('') + '</ol></div>';
  b += '<div class="hph">' + H.photos.slice(1).map(p => fig(p.photo, p.alt, p.caption)).join('') + '</div>';
  b += '<div><h3 class="sub-h">Degrees</h3><div class="degs">' + C.degrees.map(d => '<article class="deg frame">' + (d.photo ? '<div class="ph" data-full="' + esc(d.photo) + '" data-cap="' + esc(d.title) + '" role="button" tabindex="0" aria-label="Open photo: ' + esc(d.photoAlt) + '"><img src="' + esc(d.photo) + '" alt="' + esc(d.photoAlt) + '" loading="lazy"></div>' : '') + '<div class="hd2">' + gl(d.icon) + '<h4>' + esc(d.title) + '</h4></div><p class="sch">' + esc(d.school) + '</p><p class="wh">' + esc(d.when) + (d.text ? '. ' + esc(d.text) : '') + '</p></article>').join('') + '</div></div>';
  b += '<div><h3 class="sub-h">Professional assessment</h3><div class="assess frame" style="max-width:720px">' + stamp() + '<div><h3>' + esc(A.title) + '</h3><p class="code">' + esc(A.occupation) + ', ' + esc(A.code) + '</p></div><p>' + esc(A.text) + ' Assessed ' + esc(A.date) + '.</p></div></div>';
  b += '<div><h3 class="sub-h">Professional certificates</h3><div class="certs">' + C.certificates.map(c => '<div class="cert"><span class="lgbox">' + logo(c.icon) + '</span><div><h4>' + esc(c.title) + '</h4><p>' + esc(c.meta) + '. ' + esc(c.text) + '</p></div><a class="lk" href="' + esc(c.link) + '"' + ext(c.link) + '>' + logo('coursera', 'ico') + 'Verify</a></div>').join('') + '</div><p class="prep">' + esc(C.preparing) + '</p></div>';
  b += '<div><h3 class="sub-h">Training and simulations</h3><div class="groups">' + C.training.map(g => '<div><h4>' + esc(g.name) + '</h4><ul>' + g.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></div>').join('') + '</div></div>';
  const SB = C.subjects;
  b += '<details class="subj"><summary>' + esc(SB.title) + '<span class="o">Show</span><span class="c">Hide</span></summary><div class="in"><p class="note">' + esc(SB.note) + '</p>' + SB.groups.map(g => '<h4 style="font:500 14px/1.4 var(--cond);color:var(--gold-ink);margin-top:18px">' + esc(g.name) + '</h4><ul class="pills">' + g.items.map(x => '<li>' + esc(x) + '</li>').join('') + '</ul>').join('') + '</div></details>';
  return section('credentials', C.title, C.summary, 'medal', b);
}

function contactSec() {
  const C = S.contact;
  let st = ''; const yc0 = 118;
  [-104, -76, -48, -22, 24, 50, 78, 106].forEach((o, i) => {
    let d = '';
    for (let x = 0; x <= 480; x += 8) { const g = Math.exp(-Math.pow((x - 250) / 95, 2)); const push = (o < 0 ? -1 : 1) * 30 * g / (1 + Math.abs(o) / 34); d += (x ? ' L' : 'M') + x + ',' + r1(yc0 + o + push - 6 * g); }
    st += '<path d="' + d + '" fill="none" stroke="' + (i % 2 ? '#6CC4D8' : '#D9B66E') + '" stroke-width="1" opacity=".55"/>';
  });
  let up = [], lo = []; const c0 = 140, cl = 220, yc = 120, tk = .12;
  for (let i = 0; i <= 40; i++) { const xx = Math.pow(i / 40, 2), yt = 5 * tk * (0.2969 * Math.sqrt(xx) - 0.126 * xx - 0.3516 * xx * xx + 0.2843 * xx ** 3 - 0.1015 * xx ** 4) * cl, cam = 0.04 * cl * (xx < .4 ? (2 * .4 * xx - xx * xx) / .16 : ((1 - 2 * .4) + 2 * .4 * xx - xx * xx) / .36); up.push(r1(c0 + xx * cl) + ',' + r1(yc - cam - yt)); lo.unshift(r1(c0 + xx * cl) + ',' + r1(yc - cam + yt)); }
  const art = '<svg viewBox="0 0 480 240" role="img" aria-label="Streamlines flowing around a cambered aerofoil">' + st + '<polygon points="' + up.concat(lo).join(' ') + '" fill="#11233F" stroke="#EBD5A4" stroke-width="1.6"/></svg>';
  return '<section class="sec dark" id="contact" aria-labelledby="h-contact"><div class="wrap contact-grid"><div><h2 id="h-contact">' + esc(C.title) + '</h2><p>' + esc(C.text) + '</p><div class="acts"><a class="btn btn-gold" href="mailto:' + esc(P.email) + '">' + gl('mail') + 'Email me</a>' + P.links.map(l => '<a class="btn btn-line" href="' + esc(l.url) + '"' + ext(l.url) + '>' + esc(l.label) + '</a>').join('') + '</div><p class="mail">' + esc(P.email) + ', ' + esc(P.location) + '</p></div><div class="contact-art">' + art + '</div></div></section>';
}

const NAV = [['engineering', 'Engineering'], ['projects', 'Projects'], ['research', 'Research'], ['skills', 'Skills'], ['experience', 'Experience'], ['credentials', 'Credentials'], ['videos', 'Videos'], ['life', 'Life'], ['contact', 'Contact']];
$('#home').innerHTML = hero();
$('#route').innerHTML = route();
$('#sections').innerHTML = engineering() + projects() + research() + skills() + experience() + credentials() + videos() + life() + contactSec();
$('#nav').innerHTML = NAV.map(([id, l]) => '<a href="#' + id + '">' + l + '</a>').join('');
$('#brand-name').textContent = P.name;
$('#top-mail').href = 'mailto:' + P.email;
$('#foot-left').textContent = '© ' + new Date().getFullYear() + ' ' + P.name;

// menu
const nav = $('#nav'), mb = $('#menu-btn');
mb.addEventListener('click', () => { const o = nav.classList.toggle('open'); mb.setAttribute('aria-expanded', o); });
nav.addEventListener('click', e => { if (e.target.closest('a')) { nav.classList.remove('open'); mb.setAttribute('aria-expanded', 'false'); } });
// active section in the menu
const links = $$('#nav a');
if ('IntersectionObserver' in window) {
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) links.forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + en.target.id)); }), { rootMargin: '-45% 0px -50% 0px' });
  NAV.forEach(([id]) => { const el = document.getElementById(id); if (el) io.observe(el); });
}

// dialog
const dlg = $('#dlg'), body = $('#dlg-body');
function openDialog(html, cls) { body.innerHTML = html; dlg.className = 'dlg' + (cls ? ' ' + cls : ''); if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); dlg.scrollTop = 0; }
$('#dlg-x').addEventListener('click', () => dlg.close());
dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
function openProject(id) {
  const p = S.projects.find(x => x.id === id); if (!p) return;
  let h = '<div class="d-art">' + projArt(p) + '</div><div class="d-body"><p class="type">' + esc(p.type) + ', ' + esc(p.category) + '</p><h2 id="dlg-title">' + esc(p.title) + '</h2>';
  h += '<h3>What I did</h3><p>' + esc(p.description) + '</p><h3>Outcome</h3><p>' + esc(p.outcome) + '</p>';
  if (p.metrics) h += '<ul class="metrics">' + p.metrics.map(m => '<li>' + esc(m) + '</li>').join('') + '</ul>';
  if (p.steps) h += '<h3>Pipeline steps</h3><ol class="steps">' + p.steps.map(s => '<li>' + esc(s) + '</li>').join('') + '</ol>';
  if (p.rules) h += '<h3>Cleaning rules</h3><table class="rules"><thead><tr><th>Problem</th><th>Rows</th><th>Rule</th></tr></thead><tbody>' + p.rules.map(r => '<tr><td>' + esc(r[0]) + '</td><td>' + esc(r[1]) + '</td><td>' + esc(r[2]) + '</td></tr>').join('') + '</tbody></table>';
  if (p.logLines) h += '<pre class="logl">' + p.logLines.map(esc).join('\n') + '</pre>';
  if (p.ai) h += '<p class="caveat">' + esc(p.ai) + '</p>';
  h += '<div class="tags">' + (p.tags || []).map(t => '<span>' + esc(t) + '</span>').join('') + '</div>';
  h += '<div class="d-acts"><a class="btn btn-ink" href="https://github.com/Ahmed-Al-Rafsan/' + esc(p.repo) + '" target="_blank" rel="noopener noreferrer">' + mono('github') + 'Open the repository</a>' + (p.video ? '<a class="btn btn-yt" href="' + esc(p.video) + '" target="_blank" rel="noopener noreferrer">' + mono('youtube') + 'Watch the walkthrough</a>' : '') + '</div></div>';
  openDialog(h);
}
function openPost(id) {
  const p = S.posts.find(x => x.id === id); if (!p) return;
  openDialog('<div class="d-body reader"><p class="type">' + esc(p.category) + ', ' + esc(fmtDate(p.date)) + '</p><h2 id="dlg-title">' + esc(p.title) + '</h2>' + (p.body || []).map(t => '<p class="bp">' + esc(t) + '</p>').join('') + '</div>');
}
function openPhoto(el) {
  openDialog('<div class="lb"><img src="' + esc(el.dataset.full) + '" alt="' + esc((el.querySelector('img') || {}).alt || '') + '"><p class="lbc" id="dlg-title">' + esc(el.dataset.cap || '') + '</p></div>', 'lbx');
}
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o) { openProject(o.dataset.open); return; }
  const po = e.target.closest('[data-post]'); if (po) { openPost(po.dataset.post); return; }
  const ph = e.target.closest('.ph[data-full]'); if (ph) { openPhoto(ph); return; }
  const f = e.target.closest('[data-filter]');
  if (f) {
    const c = f.dataset.filter; $$('[data-filter]').forEach(b => b.setAttribute('aria-pressed', b === f));
    let n = 0; $$('.reg .row').forEach(r => { const show = c === 'All' || r.dataset.cat === c; r.hidden = !show; if (show) n++; });
    $('#reg-count').textContent = c === 'All' ? 'Showing all ' + n + ' projects' : 'Showing ' + n + ' of ' + S.projects.length + ' projects: ' + c;
  }
  const v = e.target.closest('.vlist [data-vid]');
  if (v) { setVideo(v.dataset.vid, v.dataset.title, true); $$('.vlist [data-vid]').forEach(b => b.setAttribute('aria-current', b === v)); }
  const pl = e.target.closest('#play'); if (pl) setVideo(pl.dataset.vid, null, true);
});
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.ph[data-full]')) { e.preventDefault(); openPhoto(e.target); } });
function setVideo(id, title, play) {
  const box = $('#player'); if (!box || !id) return;
  if (play) box.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + encodeURIComponent(id) + '?autoplay=1&rel=0" title="' + esc(title || 'Video walkthrough') + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
}

fixHash();
